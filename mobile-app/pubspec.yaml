name: bot_app
description: BOT - control your PC with your voice.
publish_to: "none"
version: 1.1.0+15

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  # versions confirmed to work with the Flutter used by the build (3.50)
  sensors_plus: ^7.1.1
  file_picker: ^13.3.3
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/find_phone.wav
