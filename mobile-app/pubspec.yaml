name: bot_app
description: BOT - control your PC with your voice.
publish_to: "none"
version: 0.7.2+9

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  # "any" = newest version that works with the Flutter used by the build
  sensors_plus: any
  file_picker: any

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
