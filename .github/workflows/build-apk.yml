name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --org com.botremote --project-name bot_app --platforms android .
          rm -rf test

      - name: Add permissions to AndroidManifest
        run: python3 tool/patch_android.py

      - name: Get packages
        run: |
          flutter pub get
          V=$(flutter pub deps --style=compact | grep -E "^- (sensors_plus|file_picker|speech_to_text|web_socket_channel|shared_preferences) " | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Package versions::$V"
          echo "::notice title=Flutter::$(flutter --version | head -1)"

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log; then
            MSG=$(grep -E "^\s*error " analyze.log | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Code check failed::$MSG"
            exit 1
          fi

      # Same key every build => new APKs install as updates (no uninstall needed).
      # The key lives in the repo secret ANDROID_DEBUG_KEYSTORE (base64), never in git.
      - name: Use the fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i androiddebugkey
          else
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE is not set, so this APK is signed with a throwaway key."
          fi

      - name: Build APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # Put the real error into a public annotation so it can be read without logging in
            MSG=$( (grep -A 30 "What went wrong" build.log; grep -E "^e: |error:|Error:" build.log) | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$MSG"
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk build/BOT.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs build/BOT.apk | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: BOT-apk
          path: mobile-app/build/BOT.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-app/build/BOT.apk
